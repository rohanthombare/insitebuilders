<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insite Builders | Share Digital Card</title>
    <meta name="description" content="Share the digital business card of Rohan Thombare, Insite Builders — Construction, Design, Interior and Consultancy.">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <div class="grid-overlay"></div>
    
    <main class="landing-container fade-in">
        <header class="brand-header">
            <div class="logo-placeholder">IB</div>
            <h1 class="brand-name">INSITE BUILDERS</h1>
            <p class="brand-services">Construction &nbsp;|&nbsp; Design &nbsp;|&nbsp; Interior &nbsp;|&nbsp; Consultancy</p>
        </header>

        <section class="hero-section">
            <h2 class="hero-headline">YOUR BUSINESS.<br>YOUR IDENTITY.<br><span class="text-gold">DIGITALLY.</span></h2>
            <p class="hero-subtitle">Share your professional business card instantly through WhatsApp.</p>
        </section>

        <section class="action-section">
            <div class="input-group">
                <span class="country-code">+91</span>
                <input type="tel" id="whatsappNumber" placeholder="Enter WhatsApp Number" maxlength="15" aria-label="WhatsApp Number">
            </div>
            <button id="sendCardBtn" class="btn-primary">
                SEND DIGITAL CARD
            </button>
            
            <div class="secondary-actions">
                <a href="card.html?person=rohan" class="btn-secondary">Preview Card</a>
            </div>
        </section>
        
        <footer class="landing-footer">
            <p>BUILD • DESIGN • TRANSFORM</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
